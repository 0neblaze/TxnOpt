# Stage 4 adaptive weights and search control experiment configuration.
#
# This experiment compares fixed-weights vs adaptive-weights ALNS under
# wall-clock and fixed-work budgets, using the cpu_batch backend and the
# Stage 2.3 constraint-guided operator profile with inherited dynamic
# removal-size adaptation.
#
# Formal scope: Stage 0's 12-instance, 3-seed set, 4 axes (adaptive/fixed
# × wall_clock/fixed_work) = 144 runs.

[stage04]
schema_version = "stage04-weights-v4"
experiment_id = "stage04-adaptive-weights"
algorithm = "ALNS_EXACT_CHARGING"
operator_profile = "stage02_constraint_guided"
stage02_config = "configs/stage02_constraint_guided.toml"
stage034_review_manifest = "experiments/manifests/stage03.4_control_parallel_artifact_manifest.json"

[benchmark]
directory = "data/schneider"

[run]
seeds = [2014, 2015, 2016]
time_limit_seconds = 30.0
max_iterations = 1000

[exact_deadline]
exact_backend = "cpu_batch"
exact_call_budget = 100
watchdog_seconds = 120.0
batch_size = 128

[stage04_config]
enabled = true
segment_length = 50
min_calls_per_operator = 5
weight_reaction = 0.2
weight_floor = 0.05
weight_smoothing = 0.8

# Fixed-weight ablation.
fixed_weights = false
fixed_weight_value = 1.0

# Differentiated reward tiers.
reward_rejected = 0.0
reward_accepted_worse = 0.5
reward_accepted_equal = 1.0
reward_distance_improvement = 4.0
reward_vehicle_reduction = 8.0
reward_new_global_best = 8.0
reward_new_global_best_vehicle_reduction = 16.0

# Auto SA temperature estimation.
auto_temperature = true
temperature_target_acceptance_rate = 0.5
temperature_sample_size = 30
temperature_fallback_fraction = 0.05

# Reheating.
reheat_enabled = true
reheat_stagnation_threshold = 10
reheat_factor = 0.5
max_reheats = 5

# Stagnation restart.
restart_enabled = true
restart_stagnation_threshold = 20
max_restarts = 3

# Incumbent intensification.
intensification_enabled = true
intensification_iterations = 10
intensification_removal_fraction = 0.10

# Acceptance-rate tracking.
acceptance_rate_window = 50

[stage04_fixed_config]
# Copy of stage04_config with fixed_weights=true and search control disabled.
enabled = true
segment_length = 50
min_calls_per_operator = 5
weight_reaction = 0.2
weight_floor = 0.05
weight_smoothing = 0.8
fixed_weights = true
fixed_weight_value = 1.0
reward_rejected = 0.0
reward_accepted_worse = 0.5
reward_accepted_equal = 1.0
reward_distance_improvement = 4.0
reward_vehicle_reduction = 8.0
reward_new_global_best = 8.0
reward_new_global_best_vehicle_reduction = 16.0
auto_temperature = false
temperature_target_acceptance_rate = 0.5
temperature_sample_size = 30
temperature_fallback_fraction = 0.05
reheat_enabled = false
reheat_stagnation_threshold = 10
reheat_factor = 0.5
max_reheats = 5
restart_enabled = false
restart_stagnation_threshold = 20
max_restarts = 3
intensification_enabled = false
intensification_iterations = 10
intensification_removal_fraction = 0.10
acceptance_rate_window = 50

[artifact_storage]
enabled = true
storage_policy_version = "artifact-storage-v1"
event_format = "parquet"
compression = "zstd"
compression_level = 3
critical_evidence = "full"
diagnostic_evidence = "aggregate"
per_instance_seed_max_bytes = 2147483648  # 2 GiB
per_run_max_bytes = 34359738368  # 32 GiB

[screening]
enabled = true
schema_version = "stage031-screening-v1"
negative_sequence_cache = true
epsilon = 1e-9

[cache_incremental]
enabled = true
schema_version = "stage032-cache-incremental-v1"
max_entries = 4096
max_memory_bytes = 536870912  # 512 MiB
eviction_policy = "lru"
shared_across_lanes = true
incremental_relocate = true
incremental_swap = true
station_reachability_bitset = true
charging_configuration_version = "full_recharge_v1"
objective_schema_version = "vehicles,distance,charging_time,charging_count"
