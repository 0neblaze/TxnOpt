# Stage 5.2 performance governance and stratified benchmark.

[stage05_2]
schema_version = "stage05.2-performance-v1"
stage051_manifest = "experiments/manifests/stage05.1_best_known_artifact_manifest.json"
stage04_config = "configs/stage04_weights.toml"
stage02_config = "configs/stage02_constraint_guided.toml"

[benchmark]
directory = "data/schneider"

[runtime]
max_iterations = 1000
batch_size = 128
identity_manifest = "configs/stage052_runtime_identity.local.json"

[campaign]
storage_root_locator = "configs/stage052_storage_roots.local.toml"
lock_manifest = "configs/stage052_campaign_lock.local.json"
resource_calibration_contract = "configs/stage052_resource_calibration.local.json"
staging_root_alias = "wsl_staging"
archive_root_aliases = ["e_archive"]

[retention]
policy_version = "stage05.2-single-current-v1"
archive_root_alias = "e_archive"
archive_relative_base = "stage05.2/history"
workspace_full_evidence = "active_only"
completed_action = "archive"
failed_action = "archive"

[native_kernels]
enabled = true
exact_charging = true
screening = true
propagation = true
distance_matrix = true
abi_version = "stage05.2-native-kernels-v2"
context_policy = "pack_once_per_solve"
failure_policy = "fail_fast_no_fallback"

[candidate_transaction]
enabled = true
implementation_mode = "candidate_transaction"
schema_version = "stage05.2-native-candidate-transaction-v1"
candidate_order_policy = "existing_operator_order"
exact_budget_policy = "existing_operator_exact_evaluation_budget"
cache_write_policy = "staged_atomic_commit"
failure_policy = "fail_fast_no_fallback"

# Optional fail-fast CUDA pilot adapter. Set `helper_path` only to an executable
# implementing stage05.2-accelerator-helper-v2; fallback is always forbidden.
[accelerator]
backend = "cuda"
helper_schema_version = "stage05.2-accelerator-helper-v2"
fallback_allowed = false

[artifact_storage_v1]
enabled = true
storage_policy_version = "artifact-storage-v1"
event_format = "parquet"
compression = "zstd"
compression_level = 3
critical_evidence = "full"
diagnostic_evidence = "aggregate"
per_instance_seed_max_bytes = 2147483648
per_run_max_bytes = 34359738368

[artifact_storage_v2]
enabled = true
storage_policy_version = "artifact-storage-v2"
screening_schema_version = "screening_decisions_v3"
event_format = "parquet"
compression = "zstd"
compression_level = 1
parquet_row_group_size = 262144
parquet_queue_depth = 2
critical_evidence = "full"
diagnostic_evidence = "aggregate"
per_instance_seed_max_bytes = 2147483648
per_run_max_bytes = 34359738368
