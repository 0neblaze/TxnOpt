# Unified Stage 0--8 storage governance. Machine-local absolute paths and
# physical-disk identities remain in stage052_storage_roots.local.toml.

schema_version = "experiment-storage-governance-v1"

[capacity]
archive_reserve_bytes = 0
host_reserve_bytes = 0
staging_safety_reserve_bytes = 53687091200
stage052_active_workspace_floor_bytes = 34359738368
capacity_mode = "dynamic_plan"
missing_plan_action = "reject"
unreconciled_permit_action = "reject"

[retention]
policy_version = "experiment-retention-v2"
accepted = "accepted_full"
current_chain = "accepted_full"
unique_root_cause_failure = "unique_failure_full"
duplicate_superseded_failure = "duplicate_failure_reduced"
rebuildable = "rebuildable"
unknown = "unknown_full"
duplicate_requires_signed_adjudication = true
reduced_evidence_mode = "audit_only"

[maintenance]
run_before_stage_start = true
run_after_attempt_retention = true
cache_minimum_age_days = 14
unreferenced_venv_requires_rebuild_proof = true
unreferenced_build_requires_rebuild_proof = true
active_or_unsealed_action = "retain"

[[maintenance.exact_allowlist]]
relative_path = ".cache"
kind = "cache"

[[maintenance.exact_allowlist]]
relative_path = ".venv"
kind = "venv"

[[maintenance.exact_allowlist]]
relative_path = "build"
kind = "build"

[[maintenance.exact_allowlist]]
relative_path = ".temporary-spool"
kind = "temporary_spool"
