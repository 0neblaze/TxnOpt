[stage00]
schema_version = "1"
baseline_id = "stage00-alns-current"
algorithm = "ALNS_EXACT_CHARGING"

[benchmark]
directory = "data/schneider"
instances = [
  "c101C5",
  "r105C5",
  "rc105C5",
  "c104C10",
  "r103C10",
  "rc102C10",
  "c106C15",
  "r105C15",
  "rc103C15",
  "c101_21",
  "r101_21",
  "rc101_21",
]

[run]
seeds = [2014, 2015, 2016]
time_limit_seconds = 30.0
max_iterations = 1000
threads = 1
command = "uv run python -m evrptw.experiments.stage00_baseline run --config configs/stage00_baseline.toml --output-dir results/stage00_baseline_attempt01 --baseline-dir experiments/baselines/stage00"

[artifact_storage]
enabled = true
storage_policy_version = "artifact-storage-v1"
event_format = "parquet"
compression = "zstd"
compression_level = 3
critical_evidence = "full"
diagnostic_evidence = "aggregate"
per_instance_seed_max_bytes = 2147483648
per_run_max_bytes = 34359738368
