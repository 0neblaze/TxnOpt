name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run ruff check
          src/txnopt src/txnopt_cases src/txnopt_evidence src/txnopt_legacy
          tests/core tests/cases tests/evidence
          tests/workflows tests/formal tests/legacy
      - run: uv run mypy
      - run: uv run pytest -q

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest -q
