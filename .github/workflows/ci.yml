name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy
      - run: >-
          uv run experiment-lifecycle
          --catalog configs/experiment_catalog.toml
          --state-root .experiment-lifecycle-ci
          audit --repository .
      - run: uv run pytest -m "not external_data and not formal_environment" -q

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.29"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run pytest
          tests/txnopt
          tests/test_benchmark_audit.py
          tests/test_objective.py
          tests/test_exact_charging.py
          -q
