[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "pybind11>=3.0,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "txnopt"
version = "0.1.0a1"
description = "Auditable ordered-transaction runtime for state-dependent optimization"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.3,<3",
  "ortools>=9.14,<10",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.35,<2",
]

[project.scripts]
txnopt = "txnopt_evidence.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.18,<2",
  "pybind11>=3.0,<4",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "scikit-build-core>=0.11,<0.12",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = [
  "src/txnopt",
  "src/txnopt_cases",
  "src/txnopt_evidence",
  "src/txnopt_legacy",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["._*", "**/._*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = [
  "tests/core",
  "tests/cases",
  "tests/evidence",
  "tests/workflows",
  "tests/formal",
  "tests/legacy",
]
markers = [
  "external_data: requires Schneider benchmark files or ignored raw result bundles",
  "formal_environment: requires the audited WSL/macOS host, CPU geometry, or memory envelope",
]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["txnopt", "txnopt_cases", "txnopt_evidence", "txnopt_legacy"]
strict = true
warn_unused_ignores = false
