[stage02]
schema_version = "1"
experiment_id = "stage02-constraint-guided"
algorithm = "ALNS_STAGE02_CONSTRAINT_GUIDED"
operator_profile = "stage02_constraint_guided"
baseline_dir = "experiments/baselines/stage00"
stage01_per_run = "experiments/summaries/stage01_per_run_results.csv"
comparison_per_run = "experiments/summaries/stage02_quality_attempt02_per_run_results.csv"
comparison_label = "stage02_2"
comparison_gate = "stage02_2_best_objective"

[benchmark]
directory = "data/schneider"
instances = [
  "c101C5",
  "r105C5",
  "rc105C5",
  "c104C10",
  "r103C10",
  "rc102C10",
  "c106C15",
  "r105C15",
  "rc103C15",
  "c101_21",
  "r101_21",
  "rc101_21",
]

[run]
seeds = [2014, 2015, 2016]
time_limit_seconds = 30.0
max_iterations = 1000
threads = 1

[vehicle_operators]
max_route_elimination_attempts = 8
route_elimination_exact_evaluation_budget = 256
route_merge_exact_evaluation_budget = 64
vehicle_repair_exact_evaluation_budget = 256
relocate_exact_evaluation_budget = 48
swap_exact_evaluation_budget = 48
two_opt_star_exact_evaluation_budget = 32
route_segment_exact_evaluation_budget = 32
ejection_chain_exact_evaluation_budget = 24
quality_probe_exact_evaluation_budget = 4
route_segment_min_length = 2
route_segment_max_length = 5
ejection_chain_max_depth = 3
ejection_chain_beam_width = 16

# Stage 2.3 constraint-lane exact-evaluation budgets.
constraint_probe_exact_evaluation_budget = 256
station_pressure_exact_evaluation_budget = 256
time_window_conflict_exact_evaluation_budget = 256
worst_energy_detour_exact_evaluation_budget = 256
shaw_related_exact_evaluation_budget = 256

# Dynamic removal ranges and control thresholds.
small_removal_min_fraction = 0.05
small_removal_max_fraction = 0.10
medium_removal_min_fraction = 0.10
medium_removal_max_fraction = 0.20
large_removal_min_fraction = 0.20
large_removal_max_fraction = 0.35
medium_stagnation_threshold = 4
large_stagnation_threshold = 8
exploration_period = 3
